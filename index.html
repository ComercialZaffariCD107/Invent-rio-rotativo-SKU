<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventário por SKU · CD-107</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --bg:#EEF1F8; --dot:#D3D9EA; --panel:#FFFFFF; --ink:#131A2E; --muted:#5B6683; --line:#DCE1EE;
  --navy:#0E1B3D; --navy2:#16265A; --amber:#E48B00;
  --ok:#1F8A5B; --okbg:#E1F3E9; --bad:#C0392B; --badbg:#FBE3E0;
  --warn:#A96300; --warnbg:#FDEED0; --comp:#3556B5; --compbg:#E3E9F8;
  --hov:rgba(228,139,0,.09); --cur:rgba(228,139,0,.17); --detbg:rgba(14,27,61,.045);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1024; --dot:#18244A; --panel:#121B36; --ink:#E7EBF7; --muted:#98A4C4; --line:#24325C;
    --ok:#4CC38A; --okbg:#11322A; --bad:#FF7F70; --badbg:#3A1B20;
    --warn:#F2AA42; --warnbg:#3A2A0E; --comp:#93AAF2; --compbg:#1A2750; --detbg:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1024; --dot:#18244A; --panel:#121B36; --ink:#E7EBF7; --muted:#98A4C4; --line:#24325C;
  --ok:#4CC38A; --okbg:#11322A; --bad:#FF7F70; --badbg:#3A1B20;
  --warn:#F2AA42; --warnbg:#3A2A0E; --comp:#93AAF2; --compbg:#1A2750; --detbg:rgba(255,255,255,.05);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;
  color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.num{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;max-width:1520px;margin:0 auto;padding:16px;align-items:start}
.wrap{min-width:0}
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.side h2{margin:0;font:600 16px/1.2 Oswald,Inter,sans-serif}
.side h3{margin:0;font:600 13px/1.2 Inter,sans-serif}
.drop{display:block;border:2px dashed var(--amber);border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;background:var(--bg);font-size:12.5px;color:var(--muted)}
.drop strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.drop.over,.drop:hover{background:var(--hov)}
.drop:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.stg{border:1px solid var(--amber);border-radius:10px;padding:10px;background:var(--warnbg);display:grid;gap:10px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px}
.sn{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;font-size:12px;font-weight:500;word-break:break-all}
.sn small{color:var(--muted);font-weight:400;white-space:nowrap}
.sf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sf label{font-size:11px;color:var(--muted);display:grid;gap:2px}
.sf input{font:12.5px Inter,sans-serif;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
.warn{font-size:11px;color:var(--warn);min-height:14px}
.sa{display:flex;gap:6px}
.btn2.primary{background:var(--amber);border-color:var(--amber);color:#1B1200}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.x:hover{color:var(--bad)}
.li{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.li.cur{border-color:var(--amber);background:var(--hov)}
.lbtn,.li.all{flex:1;text-align:left;border:0;background:transparent;color:var(--ink);font:13px Inter,sans-serif;padding:8px 10px;cursor:pointer;display:block;width:100%;border-radius:8px}
.lbtn b,.li.all{font-weight:600}
.lbtn small,.li.all small{display:block;color:var(--muted);font-weight:400;font-size:11px}
button.li.all{margin-bottom:6px}
.lbtn:focus-visible,.li.all:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.sidefoot{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.sidefoot .hint{margin:4px 0 0}
.mtabs{display:flex;gap:6px;padding:12px 0 0;flex-wrap:wrap;align-items:center}
.mtabs .lb{font-size:12px;color:var(--muted);margin-right:4px}
.mtab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 13px Inter,sans-serif;cursor:pointer}
.mtab small{opacity:.65;margin-left:4px}
.mtab[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#1B1200}
.mtab:hover{border-color:var(--amber);background:var(--panel)} .mtab[aria-pressed=true]:hover{background:var(--amber)}
.mtab:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sidebtn{display:none}
input[type=file]{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .app.side-closed .side{display:none}
  .sidebtn{display:inline-block}
}
#report{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;padding:0 0 4px}

/* topo */
.top{background:var(--navy);color:#fff;border-radius:12px 12px 0 0;padding:18px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid var(--amber)}
.top h1{margin:0;font:600 24px/1.1 Oswald,Inter,sans-serif;letter-spacing:.01em}
.top .sub{margin-top:5px;color:#AEB9DA;font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,139,0,.6)}70%{box-shadow:0 0 0 8px rgba(228,139,0,0)}100%{box-shadow:0 0 0 0 rgba(228,139,0,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:500 12.5px Inter,sans-serif;border-radius:8px;padding:8px 12px;border:1px solid #3A4A82;background:var(--navy2);color:#fff;cursor:pointer}
button:hover,.btn:hover{background:#1E3273}
button.primary{background:var(--amber);border-color:var(--amber);color:#1B1200}
button.primary:hover{background:#F39C12}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible,.chip:focus-visible,tr.sku:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input[type=file]{display:none}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 12.5px Inter,sans-serif;cursor:pointer}
.chip:hover{border-color:var(--amber);background:var(--panel)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{opacity:.7;margin-left:4px}

/* hero */
.hero{display:grid;grid-template-columns:300px 1fr;gap:14px}
.ledger{background:var(--navy);color:#fff;border-radius:12px;padding:20px}
.ledger .big{font:600 54px/1 Oswald,Inter,sans-serif;margin:6px 0 10px}
.ledger .lbl{color:#AEB9DA;font-size:12.5px}
.bar{height:6px;border-radius:99px;background:#2B3A70;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber)}
.ledger dl{margin:18px 0 0;display:grid;gap:0}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid #2B3A70}
.ledger dt{color:#AEB9DA;font-size:12.5px}
.ledger dd{margin:0;text-align:right;font-weight:600}
.ledger dd small{display:block;color:#8E9BC4;font-weight:400;font-size:11px}

.map{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.map h2,.panel h2{margin:0 0 3px;font:600 16px/1.2 Oswald,Inter,sans-serif;letter-spacing:.01em}
.hint{color:var(--muted);font-size:12px;margin:0 0 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border-radius:8px;padding:9px 10px;border:1px solid transparent;border-left-width:4px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile .cod{font-size:11px;color:var(--muted)}
.tile .nm{font-size:12px;font-weight:500;line-height:1.25;max-height:2.5em;overflow:hidden}
.tile .ft{margin-top:auto;font-size:12px;font-weight:600}
.tile.ok{background:var(--okbg);border-left-color:var(--ok)} .tile.ok .ft{color:var(--ok)}
.tile.div{background:var(--warnbg);border-left-color:var(--amber)} .tile.div .ft{color:var(--warn)}
.tile.crit{background:var(--badbg);border-left-color:var(--bad)} .tile.crit .ft{color:var(--bad)}
.tile.comp{background:var(--compbg);border-left-color:var(--comp)} .tile.comp .ft{color:var(--comp)}
.legend .l-ok{--c:var(--ok)} .legend .l-div{--c:var(--amber)} .legend .l-crit{--c:var(--bad)} .legend .l-comp{--c:var(--comp)}


/* abas e evolução */
.tabs{display:flex;gap:6px;padding:12px 0 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px 8px 0 0;padding:9px 16px;font:500 13px Inter,sans-serif;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy);border-bottom-color:var(--amber)}
.tab:hover{background:var(--panel)} .tab[aria-pressed=true]:hover{background:var(--navy)}
.tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px;border-left:4px solid var(--amber)}
.kstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--navy);color:#fff;border-radius:12px;margin-top:14px;overflow:hidden}
.kstrip>div{padding:16px 18px;border-right:1px solid #2B3A70}
.kstrip>div:last-child{border-right:0}
.kstrip .k{color:#AEB9DA;font-size:12px}
.kstrip .v{font:600 30px/1.1 Oswald,Inter,sans-serif;margin-top:2px}
.kstrip small{display:block;color:#8E9BC4;font-size:11px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--ink);border:0;border-radius:0;padding:6px 12px;font:500 12.5px Inter,sans-serif}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 14px}
.charts h3{margin:0 0 4px;font:500 13px Inter,sans-serif;color:var(--muted)}
.charts .tw{border:1px solid var(--line);border-radius:10px;padding:6px}
.delta{display:block;font-size:11px;color:var(--muted)}
.delta.up{color:var(--warn)}
table.evo{min-width:900px}
table.evo tr:last-child td{font-weight:600}
.matrix{min-width:0;width:auto}
.matrix th{text-align:center;padding:6px 4px;font-size:11px;line-height:1.2}
.matrix th:first-child,.matrix td:first-child{text-align:left;min-width:220px}
.matrix td{padding:6px 4px;text-align:center}
.mc{display:inline-block;width:20px;height:20px;border-radius:5px;vertical-align:middle}
.mc.ok{background:var(--okbg);border:1px solid var(--ok)}
.mc.div{background:var(--amber)} .mc.crit{background:var(--bad)}
.mc.none{background:transparent;border:1px dashed var(--line)}
.matrix td.sum{text-align:right;padding-left:14px;white-space:nowrap}
.hist td,.hist th{font-size:12.5px}
.btn2{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 12px Inter,sans-serif;cursor:pointer}
.btn2:hover{border-color:var(--amber);background:var(--panel)}
.btn2.del{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--amber);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw;display:none}
.chips select{font:500 12.5px Inter,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
@media (max-width:860px){.kstrip{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}

/* faixa financeira */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.fin{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;align-items:center}
.fin .cell .k{font-size:12px;color:var(--muted)}
.fin .cell .v{font:600 26px/1.15 Oswald,Inter,sans-serif}
.fin .cell.right{text-align:right}
.fin .sobra .v{color:var(--ok)} .fin .falta .v{color:var(--bad)}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}
.split .f{background:var(--bad)} .split .s{background:var(--ok)}
.fin .mid .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;gap:10px;flex-wrap:wrap}
.fin .mid .cap b{color:var(--ink)}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* atenção */
.notes{display:grid;gap:8px;margin-top:14px}
.note{border-radius:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);font-size:13px}
.note b{font-weight:600}

/* tabela */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}
.tools input[type=search],.tools select{font:13px Inter,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tools label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:8px 8px;border-bottom:2px solid var(--navy)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tr.sku{cursor:pointer}
tr.sku:hover td{background:var(--hov)}
.skuname{font-weight:500;font-size:13px;display:block;text-align:left}
.skucod{font-size:11px;color:var(--muted)}
.chev{display:inline-block;width:14px;color:var(--amber);transition:transform .15s}
tr.open .chev{transform:rotate(90deg)}
.imp{display:grid;grid-template-columns:78px 1fr 78px;gap:6px;align-items:center;min-width:280px}
.imp .v{font-size:11.5px}
.dv{position:relative;height:10px;background:var(--line);border-radius:3px}
.dv::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.dv i{position:absolute;top:0;bottom:0}
.dv i.f{right:50%;background:var(--bad);border-radius:3px 0 0 3px}
.dv i.s{left:50%;background:var(--ok);border-radius:0 3px 3px 0}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.div{background:var(--warnbg);color:var(--warn)}
.pill.crit{background:var(--badbg);color:var(--bad)} .pill.comp{background:var(--compbg);color:var(--comp)}
tr.det td{background:var(--detbg);padding:6px 8px 14px 30px}
.det table{min-width:0;font-size:12px}
.det th{border-bottom:1px solid var(--line);color:var(--muted)}
.det td{border-bottom:1px dashed var(--line);padding:5px 8px;background:transparent}
.tag{font-size:11px;color:var(--warn);font-weight:500}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .panel{margin-top:14px}
.mini table{min-width:0;font-size:12.5px}
.mini tr.lote{cursor:pointer}
.mini tr.lote:hover td{background:var(--hov)}
.mini tr.cur td{background:var(--cur)}
.foot{margin:14px 2px 0;color:var(--muted);font-size:11.5px;display:grid;gap:3px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.exporting .noexp{display:none!important}
@media print{
  @page{size:A4 portrait;margin:10mm}
  .noexp{display:none!important}
  :root{padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app{display:block;padding:0}
  .side,.sidebtn{display:none!important}
  .wrap{max-width:none;padding:0}
  .hero,.panel,.note,.top{break-inside:avoid}
  .notes{margin-top:10px}
}

/* ============ ACURACIDADE DE SKUs (relatório no molde "Acuracidade de Ruas") ============ */
#accReport{display:grid;gap:16px;margin-top:12px;padding:4px 0 8px}
.ah{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ah h1{margin:0;font:600 30px/1.1 Oswald,Inter,sans-serif;letter-spacing:.01em;text-transform:uppercase}
.ah .sub{margin-top:6px;color:#C9D2EC;font-size:14px}
.ah .acts{display:flex;gap:8px;flex-wrap:wrap}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.kc .k{font:600 12.5px/1.2 Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kc .v{font:700 34px/1.1 Inter,sans-serif;margin-top:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.kc .s{font-size:12px;color:var(--muted);margin-top:4px}
.kc .v.g,.g{color:var(--ok)} .kc .v.r,.r{color:var(--bad)}
.ablock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ablock h2,.acomp-h{margin:0 0 12px;font:600 20px/1.2 Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
.acomp-h{margin:4px 0 0 4px}
.ablock .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
table.at{min-width:980px;font-size:13px}
table.at thead th{background:var(--navy);color:#fff;font:600 12px/1.25 Inter,sans-serif;text-align:center;padding:9px 8px;border:0;border-right:1px solid #2B3A70}
table.at thead th:first-child{border-radius:8px 0 0 0;text-align:left;padding-left:12px}
table.at thead th:last-child{border-radius:0 8px 0 0;border-right:0}
table.at td{text-align:center;padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
table.at td:last-child{border-right:0}
table.at td:first-child{text-align:left;padding-left:12px}
table.at tr.tot td{background:var(--detbg);font-weight:700}
table.at tr.agg td{color:var(--muted);font-style:italic}
table.at .pn{font-size:12.5px;line-height:1.25;display:block;max-width:300px}
table.at .pc{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",ui-monospace,monospace}
table.at .np{font-size:11px;color:var(--warn)}
.acomp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cc{border-radius:12px;padding:16px 20px;border:1px solid transparent}
.cc h3{margin:0 0 10px;font:600 20px/1.2 Oswald,Inter,sans-serif;text-transform:uppercase}
.cc dl{margin:0;display:grid;grid-template-columns:1fr 1fr;row-gap:10px;font-size:15px}
.cc dt{font-weight:600} .cc dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.cc.gain{background:var(--okbg)} .cc.gain h3{color:var(--ok)}
.cc.loss,.cc.net.neg{background:var(--badbg)} .cc.loss h3,.cc.net.neg h3,.cc.net.neg dl{color:var(--bad)}
.cc.net.pos{background:var(--okbg)} .cc.net.pos h3,.cc.net.pos dl{color:var(--ok)}
.cc.net.zero{background:var(--panel);border-color:var(--line)}
.anote{font-size:11.5px;color:var(--muted);margin:0 4px;line-height:1.5}
.exporting #accReport{width:1240px;padding:18px;background:var(--bg)}
@media (max-width:860px){.kgrid,.acomp{grid-template-columns:1fr}.ah h1{font-size:22px}.kc .v{font-size:28px}}

@media (max-width:860px){
  .hero,.two,.fin{grid-template-columns:1fr}
  .fin .cell.right{text-align:left}
  .top h1{font-size:20px}
}

<div class="app" id="app">

const monthLong = k => k==='all' ? 'todo o histórico' : k==='sem-data' ? 'lotes sem data' : `${MES_LONG[+k.slice(5)-1]} de ${k.slice(0,4)}`;
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',4200); }

function parseNum(v){
  if (typeof v === 'number') return v;
  const s = String(v ?? '').trim();
  if (!s) return 0;
  return parseFloat(s.replace(/\./g,'').replace(',','.')) || 0;
}
function normRow(a){
  const end = String(a[0]).trim(), emb = String(a[3]||'').trim();
  const cont = parseNum(a[4]), ger = parseNum(a[5]);
  const div = a[6]===undefined||a[6]==='' ? cont-ger : parseNum(a[6]);
  const val = parseNum(a[7]), f = factor(emb);
  return {end, cod:String(parseNum(a[1])), prod:clean(a[2]), emb, f, tipo:end.slice(-1).toUpperCase()==='A'?'A':'P',
          cont, ger, div, val, gerU:ger*f, divU:div*f};
}
const compactRow = r => [r.end, +r.cod, r.prod, r.emb, r.cont, r.ger, r.div, r.val];
const isAddr = v => /^\d+\.\d+\./.test(String(v||'').trim());

function parseCSV(text){
  return text.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean)
    .map(l=>l.split(';')).filter(a=>a.length>=8 && isAddr(a[0])).map(normRow);
}
function labelFromSheet(name){
  const m = /LOTE\s*(\d+)\s*[-–]?\s*([\d./]+)?/i.exec(name);
  if (!m) return name;
  return 'Lote '+m[1]+(m[2] ? ' · '+m[2].replace(/\./g,'/') : '');
}
function idFromSheet(name){ const m=/LOTE\s*(\d+)/i.exec(name); return m ? m[1] : safeId(name); }
function dateFromSheet(name){
  const m = /[-–]\s*(\d{1,2})[./](\d{1,2})/.exec(name); if(!m) return null;
  const now = new Date(); let y = now.getFullYear();
  const d = new Date(y, +m[2]-1, +m[1]);
  if (d.getTime() > now.getTime() + 3*864e5) y--;
  return `${y}-${pad2(+m[2])}-${pad2(+m[1])}`;
}
function askDate(label){
  const r = prompt(`Data do lote "${label}" (dd/mm/aaaa). Deixe vazio para usar hoje.`, '');
  const m = r && /(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?/.exec(r);
  if(!m) return isoToday();
  let y = m[3] ? +m[3] : new Date().getFullYear(); if (y<100) y+=2000;
  return `${y}-${pad2(+m[2])}-${pad2(+m[1])}`;
}

/* ============ ARMAZENAMENTO (local ou Firebase) ============ */
const LS_KEY = 'cd107_inv_sku_hist_v1';
let memStore = [];
const Store = {
  mode:'local', db:null,
  loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('script')); document.head.appendChild(s); }); },
  async init(){
    if(!FIREBASE_CONFIG) return;
    try{
      const v='10.12.2';
      await this.loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await this.loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
      const app = firebase.initializeApp(FIREBASE_CONFIG,'inv-sku');
      this.db = app.firestore(); this.mode='firebase';
    }catch(e){ toast('Firebase indisponível. Usando o histórico local deste navegador.'); }
  },
  async load(){
    if(this.mode==='firebase'){
      const snap = await this.db.collection(FIRESTORE_COLLECTION).get();
      return snap.docs.map(d=>{ const x=d.data(); return {id:x.id,label:x.label,date:x.date,rows:JSON.parse(x.rowsJson||'[]')}; });
    }
    try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch(e){ return memStore.slice(); }
  },
  async save(lot){   // lot: {id,label,date,rows(compactas)}
    if(this.mode==='firebase'){
      await this.db.collection(FIRESTORE_COLLECTION).doc(lot.id).set({id:lot.id,label:lot.label,date:lot.date,rowsJson:JSON.stringify(lot.rows),updatedAt:Date.now()});
      return;
    }
    const all = (await this.load()).filter(l=>l.id!==lot.id); all.push(lot);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(all)); }catch(e){ memStore = all; }
  },
  async remove(id){
    if(this.mode==='firebase'){ await this.db.collection(FIRESTORE_COLLECTION).doc(id).delete(); return; }
    const all = (await this.load()).filter(l=>l.id!==id);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(all)); }catch(e){ memStore = all; }
  }
};

/* ============ ESTADO ============ */
const state = {view:'sku', month:null, lots:[], sample:true, scope:'all', open:new Set(), q:'', onlyDiv:false, sort:'imp', evoMode:'cum', staged:[], accAll:false, price:new Map()};
const hydrate = list => list.map(l=>({id:l.id,label:l.label,date:l.date||null,rows:l.rows.map(normRow)}));

function setLots(defs){
  const byDate = (a,b)=> (a.date||'9999').localeCompare(b.date||'9999') || String(a.id).localeCompare(String(b.id),'pt-BR',{numeric:true});
  state.lots = [...defs].sort(byDate).map(d=>({id:d.id,label:d.label,date:d.date,rows:d.rows}));
  state.scope='all'; state.open.clear(); state.q=''; state.onlyDiv=false;
  state.price = priceMap(state.lots);
  const seen = new Map();
  state.lots.forEach((lot,i)=>{
    lot.gi = i;
    lot.out = lot.rows.map(r=>({...r, lotIdx:i, hist:(seen.get(r.end+'|'+r.cod)||[]).slice()}));
    lot.out.forEach(r=>{
      const k = r.end+'|'+r.cod;
      seen.set(k,[...(seen.get(k)||[]),{lotIdx:i,div:r.div,val:r.val}]);
    });
  });
}
function monthList(){
  const s=[...new Set(state.lots.map(l=>monthKey(l.date)))];
  return s.filter(k=>k!=='sem-data').sort((a,b)=>b.localeCompare(a)).concat(s.includes('sem-data')?['sem-data']:[]);
}
function ensureMonth(){
  const ms=monthList();
  if(state.month!=='all' && !ms.includes(state.month)) state.month = ms[0] || 'all';
}
const monthLots = () => state.month==='all' ? state.lots : state.lots.filter(l=>monthKey(l.date)===state.month);
async function reloadFromStore(){
  let raw=[]; try{ raw = await Store.load(); }catch(e){ toast('Não consegui ler o histórico: '+e.message); }
  if(raw.length){ state.sample=false; setLots(hydrate(raw)); }
  else { state.sample=true; setLots(EMBEDDED.map(l=>({id:l.id,label:l.label,date:l.date,rows:l.rows.map(normRow)}))); }
  ensureMonth();
}
function scopeRows(){
  if (state.scope==='all'){
    const m = new Map();
    monthLots().forEach(l=>l.out.forEach(r=>m.set(r.end+'|'+r.cod, r)));
    return [...m.values()];
  }
  return state.lots[state.scope]?.out || [];
}

/* ============ ANÁLISE ============ */
function analyze(rows){
  const skuMap = new Map();
  const area = {A:{n:0,nDiv:0,ger:0,abs:0,sobra:0,falta:0}, P:{n:0,nDiv:0,ger:0,abs:0,sobra:0,falta:0}};
  const T = {n:0,nDiv:0,ger:0,abs:0,sobra:0,falta:0,nSobra:0,nFalta:0};
  rows.forEach(r=>{
    let s = skuMap.get(r.cod);
    if(!s){ s = {cod:r.cod,prod:r.prod,rows:[],n:0,nDiv:0,ger:0,abs:0,sobra:0,falta:0,nA:0,nP:0}; skuMap.set(r.cod,s); }
    const isDiv = r.div!==0, ab = Math.abs(r.divU);
    [s, T, area[r.tipo]].forEach(t=>{
      t.n++; t.ger+=r.gerU; t.abs+=ab;
      if(isDiv) t.nDiv++;
      if(r.val>0) t.sobra+=r.val; else if(r.val<0) t.falta+=r.val;
    });
    if(r.val>0) T.nSobra++; else if(r.val<0) T.nFalta++;
    s.rows.push(r); r.tipo==='A'?s.nA++:s.nP++;
  });
  const skus = [...skuMap.values()];
  skus.forEach(s=>{
    s.gross = s.sobra - s.falta; s.saldo = s.sobra + s.falta; s.acc = accOf(s.ger,s.abs);
    if(!s.nDiv) s.status='ok';
    else if(s.sobra>0 && s.falta<0 && Math.abs(s.saldo)<=COMP_TOL*s.gross) s.status='comp';
    else if(s.gross>=CRIT) s.status='crit';
    else s.status='div';
  });
  return {skus, T, area};
}

/* preço unitário implícito de cada SKU: |Valor Divergência| ÷ |Divergência em unidades|.
   A planilha só traz valor nas linhas divergentes, então o preço vem da divergência mais recente do SKU em todo o histórico. */
function priceMap(lots){
  const m = new Map();
  lots.forEach(l=>l.rows.forEach(r=>{ if(r.divU && r.val) m.set(r.cod, Math.abs(r.val)/Math.abs(r.divU)); }));
  return m;
}

/* acuracidade financeira + quantitativa, por área (apanha/pulmão), no total e por SKU */
function accAnalyze(rows){
  const P = state.price;
  const mk = () => ({n:0,nDiv:0,aud:0,dv:0,ger:0,qd:0,sQ:0,fQ:0,sV:0,fV:0,sk:new Set(),skD:new Set(),skS:new Set(),skF:new Set(),noP:new Set()});
  const area = {A:mk(), P:mk()}, T = mk(), S = new Map();
  rows.forEach(r=>{
    let s = S.get(r.cod); if(!s){ s = Object.assign(mk(),{cod:r.cod,prod:r.prod}); S.set(r.cod,s); }
    const p = P.get(r.cod), aud = p===undefined ? 0 : r.gerU*p;
    [T, area[r.tipo], s].forEach(t=>{
      t.n++; t.ger+=r.gerU; t.qd+=Math.abs(r.divU); t.aud+=aud; t.dv+=Math.abs(r.val);
      t.sk.add(r.cod); if(r.div!==0){ t.nDiv++; t.skD.add(r.cod); }
      if(r.divU>0) t.sQ+=r.divU; else if(r.divU<0) t.fQ-=r.divU;
      if(r.val>0){ t.sV+=r.val; t.skS.add(r.cod); } else if(r.val<0){ t.fV-=r.val; t.skF.add(r.cod); }
      if(p===undefined) t.noP.add(r.cod);
    });
  });
  const fin = t => { t.sem = t.aud - t.dv; t.accF = t.aud>0 ? accOf(t.aud,t.dv) : null; t.accQ = accOf(t.ger,t.qd); return t; };
  [T, area.A, area.P].forEach(fin);
  const skus = [...S.values()].map(fin);
  return {T, area, skus};
}

/* evolução por dia (cada dia = última contagem de cada endereço/SKU dentro do dia) */
function evoData(lots){
  const groups = new Map();
  lots.forEach(l=>{ const d=l.date||'sem-data'; if(!groups.has(d)) groups.set(d,[]); groups.get(d).push(l); });
  const days=[]; const cumSkus=new Set(), cumEnd=new Set(); let cSobra=0,cFalta=0;
  [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([d,ls])=>{
    const m = new Map(); ls.forEach(l=>l.out.forEach(r=>m.set(r.end+'|'+r.cod,r)));
    const rows=[...m.values()], a=analyze(rows);
    rows.forEach(r=>{ cumSkus.add(r.cod); cumEnd.add(r.end+'|'+r.cod); });
    cSobra+=a.T.sobra; cFalta+=a.T.falta;
    days.push({date:d,lotes:ls.length,skus:a.skus.length,skusCum:cumSkus.size,n:a.T.n,nCum:cumEnd.size,nDiv:a.T.nDiv,
      acc:accOf(a.T.ger,a.T.abs),sobra:a.T.sobra,falta:a.T.falta,abs:a.T.sobra-a.T.falta,saldo:a.T.sobra+a.T.falta,
      cSobra,cFalta,cAbs:cSobra-cFalta,cSaldo:cSobra+cFalta});
  });
  return days;
}

/* recorrência: SKUs e endereços que divergem em mais de um lote */
function recurrence(lots){
  const bySku=new Map(), byKey=new Map();
  lots.forEach((l,i)=>l.out.forEach(r=>{
    let s=bySku.get(r.cod);
    if(!s){ s={cod:r.cod,prod:r.prod,per:new Array(lots.length).fill(null),abs:0,saldo:0}; bySku.set(r.cod,s); }
    const c = s.per[i] || (s.per[i]={n:0,nDiv:0,val:0,abs:0});
    c.n++; if(r.div!==0){ c.nDiv++; c.val+=r.val; c.abs+=Math.abs(r.val); s.abs+=Math.abs(r.val); s.saldo+=r.val;
      const k=r.end+'|'+r.cod; let e=byKey.get(k);
      if(!e){ e={end:r.end,cod:r.cod,prod:r.prod,emb:r.emb,ev:[]}; byKey.set(k,e); }
      e.ev.push({i,div:r.div,val:r.val});
    }
  }));
  const skus=[...bySku.values()];
  skus.forEach(s=>{ s.audited=s.per.filter(Boolean).length; s.divLotes=s.per.filter(c=>c&&c.nDiv>0).length; });
  const rec = skus.filter(s=>s.divLotes>=2).sort((a,b)=>b.divLotes-a.divLotes||b.abs-a.abs);
  const addrs = [...byKey.values()].filter(e=>e.ev.length>=2).sort((a,b)=>b.ev.length-a.ev.length||Math.abs(b.ev[0].val)-Math.abs(a.ev[0].val));
  return {skus,rec,addrs};
}

/* ============ GRÁFICO SVG (cores resolvidas para funcionar na exportação PNG) ============ */
function svgChart(labels, series, fmt){
  const n=labels.length, slot=58, W=Math.max(420,n*slot+24), H=210, pt=26, pb=34;
  const sums = labels.map((_,i)=>({p:series.reduce((a,s)=>a+Math.max(0,s.vals[i]),0), q:series.reduce((a,s)=>a+Math.max(0,-s.vals[i]),0)}));
  const maxP=Math.max(1,...sums.map(s=>s.p)), maxN=Math.max(0,...sums.map(s=>s.q));
  const scale=(H-pt-pb)/(maxP+maxN), y0=pt+maxP*scale, muted=css('--muted'), line=css('--line'), ink=css('--ink');
  let g=`<line x1="8" x2="${W-8}" y1="${y0}" y2="${y0}" stroke="${muted}" stroke-width="1"/>`;
  labels.forEach((lb,i)=>{
    const cx=12+i*slot+slot/2, bw=Math.min(34,slot-20); let up=y0, dn=y0;
    series.forEach(s=>{
      const v=s.vals[i]; if(!v) return; const h=Math.abs(v)*scale;
      if(v>0){ up-=h; g+=`<rect x="${cx-bw/2}" y="${up}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${s.color}"/>`; }
      else { g+=`<rect x="${cx-bw/2}" y="${dn}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${s.color}"/>`; dn+=h; }
    });
    if(sums[i].p>0) g+=`<text x="${cx}" y="${up-5}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${ink}" font-family="Inter,Arial,sans-serif">${fmt(sums[i].p)}</text>`;
    if(sums[i].q>0) g+=`<text x="${cx}" y="${dn+12}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${ink}" font-family="Inter,Arial,sans-serif">${fmt(-sums[i].q)}</text>`;
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="${muted}" font-family="Inter,Arial,sans-serif">${esc(lb)}</text>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function render(){
  renderMonthTabs(); renderTabs(); renderSide();
  if(state.view==='evo') renderEvo(); else if(state.view==='acc') renderAcc(); else renderSku();
}
function renderMonthTabs(){
  const m=$('#mtabs'), ms=monthList();
  const cnt = k => k==='all' ? state.lots.length : state.lots.filter(l=>monthKey(l.date)===k).length;

function renderTabs(){

  t.innerHTML = `<button type="button" class="tab" data-v="sku" aria-pressed="${state.view==='sku'}">Inventário por SKU</button>
                 <button type="button" class="tab" data-v="acc" aria-pressed="${state.view==='acc'}">Acuracidade de SKUs</button>

function renderSide(){

/* ============ RENDER: visão por SKU ============ */
function renderSku(){
  const rows = scopeRows();
  const box = $('#body');
  if(!rows.length){ box.innerHTML = '<div class="panel empty">Nenhum dado carregado. Use “Carregar planilha” com o arquivo do inventário rotativo.</div>'; $('#sub').textContent=''; return; }
  const {skus,T,area} = analyze(rows);
  const okSkus = skus.filter(s=>s.status==='ok').length;
  const accQ = accOf(T.ger,T.abs);
  const gross = T.sobra - T.falta, saldo = T.sobra + T.falta;
  const scopeName = state.scope==='all' ? 'Consolidado · '+monthShort(state.month) : state.lots[state.scope].label;
  $('#sub').textContent = `${scopeName} · ${skus.length} SKUs · ${T.n} endereços · emitido em ${new Date().toLocaleDateString('pt-BR')}`;

  const order = {crit:0,div:1,comp:2,ok:3};
  const tiles = [...skus].sort((a,b)=>order[a.status]-order[b.status] || b.gross-a.gross || a.cod-b.cod).map(s=>{
    const ft = s.status==='ok' ? 'Sem divergência' : s.status==='comp' ? `Compensa ±${fBRL0(s.sobra)}` : `${fBRL0(s.saldo)}`;
    return `<button type="button" class="tile ${s.status}" data-cod="${s.cod}" title="${esc(s.prod)}">
      <span class="cod num">${s.cod}</span><span class="nm">${esc(s.prod)}</span><span class="ft">${ft}</span></button>`;
  }).join('');
  const cnt = k => skus.filter(s=>s.status===k).length;
  const fShare = gross>0 ? (-T.falta/gross*100) : 50, sShare = gross>0 ? (T.sobra/gross*100) : 50;

  const notes = [];
  const byGross = skus.filter(s=>s.gross>0).sort((a,b)=>b.gross-a.gross);
  if (gross>0 && byGross.length>=3){
    const top = byGross.slice(0,3), share = top.reduce((a,s)=>a+s.gross,0)/gross;
    if (share>=0.6) notes.push(`<b>${fPct(share,0)} da divergência absoluta</b> está em 3 SKUs: ${top.map(s=>esc(s.prod)).join('; ')}.`);
  }
  skus.filter(s=>s.status==='comp').forEach(s=>{
    const rs = s.rows.filter(r=>r.val>0), rf = s.rows.filter(r=>r.val<0);
    const reab = rs.every(r=>r.tipo==='P') && rf.every(r=>r.tipo==='A');
    notes.push(`<b>${esc(s.prod)}</b>: sobra de ${fBRL(s.sobra)} em ${rs.length} endereço(s) e falta de ${fBRL(-s.falta)} em ${rf.length}, saldo ${fBRL(s.saldo)}. ${reab ? 'Sobra no pulmão e falta na apanha: compatível com reabastecimento feito sem baixa no sistema.' : 'Sobra e falta se anulam: parece erro de endereço, não perda.'}`);
  });
  const reinc = rows.filter(r=>r.div!==0 && r.hist.some(h=>h.div===r.div && h.val===r.val));

function renderTable(skus){
  let list = skus.filter(s=>{
    if(state.onlyDiv && s.status==='ok') return false;
    if(state.q){ const q=state.q.toLowerCase(); return s.cod.includes(q) || s.prod.toLowerCase().includes(q); }
    return true;
  });
  const cmp = {imp:(a,b)=>b.gross-a.gross||a.acc-b.acc, acc:(a,b)=>a.acc-b.acc||b.gross-a.gross, cod:(a,b)=>a.cod-b.cod}[state.sort];
  list.sort(cmp);
  const maxSide = Math.max(1,...skus.map(s=>Math.max(s.sobra,-s.falta)));
  if(!list.length){ $('#tbl').innerHTML='<div class="empty">Nenhum SKU encontrado com esse filtro.</div>'; return; }
  const rowsHtml = list.map(s=>{
    const open = state.open.has(s.cod);
    const fw = (-s.falta/maxSide*50).toFixed(1), sw = (s.sobra/maxSide*50).toFixed(1);
    const det = open ? `<tr class="det"><td colspan="7"><table>
      <thead><tr><th>Endereço</th><th>Área</th><th>Emb.</th><th>Gerada</th><th>Contada</th><th>Diverg.</th><th>Valor</th><th>Lote</th><th></th></tr></thead><tbody>
      ${[...s.rows].sort((a,b)=>(b.div!==0)-(a.div!==0)||Math.abs(b.val)-Math.abs(a.val)).map(r=>{
        const rep = r.div!==0 && r.hist.some(h=>h.div===r.div&&h.val===r.val);
        const prev = r.div!==0 && !rep && r.hist.some(h=>h.div!==0);
        return `<tr><td class="num" style="text-align:left">${esc(r.end)}</td><td>${r.tipo==='A'?'Apanha':'Pulmão'}</td><td>${esc(r.emb)}</td>
        <td class="num">${fNum(r.ger)}</td><td class="num">${fNum(r.cont)}</td><td class="num ${signCls(r.div)}">${r.div>0?'+':''}${fNum(r.div)}</td>
        <td class="num ${signCls(r.val)}">${r.val?fBRL(r.val):'–'}</td><td>${esc(state.lots[r.lotIdx].label)}</td>
        <td class="tag">${rep?'divergência repetida':prev?'já divergiu em lote anterior':''}</td></tr>`;}).join('')}
      </tbody></table></td></tr>` : '';
    return `<tr class="sku ${open?'open':''}" data-cod="${s.cod}" id="sku-${s.cod}" tabindex="0" aria-expanded="${open}">
      <td><span class="skuname"><span class="chev">▸</span>${esc(s.prod)}</span><span class="skucod num" style="margin-left:14px">${s.cod}</span></td>
      <td class="num">${s.n}${s.nDiv?` <span class="tag">(${s.nDiv} div.)</span>`:''}<br><span class="skucod">${s.nP} pulmão · ${s.nA} apanha</span></td>
      <td class="num">${fInt(s.ger)}</td>
      <td><div class="imp"><span class="v num neg">${s.falta?fBRL0(s.falta):'–'}</span><div class="dv"><i class="f" style="width:${fw}%"></i><i class="s" style="width:${sw}%"></i></div><span class="v num pos" style="text-align:right">${s.sobra?fBRL0(s.sobra):'–'}</span></div></td>
      <td class="num ${signCls(s.saldo)}">${s.nDiv?fBRL0(s.saldo):'–'}</td>
      <td class="num">${fPct(s.acc)}</td>
      <td><span class="pill ${s.status}">${STATUS[s.status]}</span></td></tr>${det}`;
  }).join('');
  $('#tbl').innerHTML = `<table><thead><tr><th>SKU</th><th>Endereços</th><th>Qtd. gerada (un.)</th><th style="text-align:center">Falta ◂ impacto R$ ▸ Sobra</th><th>Saldo</th><th>Acur. qtd.</th><th style="text-align:right">Status</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
  document.querySelectorAll('tr.sku').forEach(tr=>{
    const go=()=>{ const c=tr.dataset.cod; state.open.has(c)?state.open.delete(c):state.open.add(c); renderTable(skus); const el=document.getElementById('sku-'+c); if(el) el.focus({preventScroll:true}); };
    tr.addEventListener('click',go);
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
}
function bindSku(skus){
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{
    state.open.add(t.dataset.cod); state.q=''; $('#q').value=''; renderTable(skus);
    const el=document.getElementById('sku-'+t.dataset.cod);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus({preventScroll:true}); }
  }));
  $('#q').addEventListener('input',e=>{ state.q=e.target.value.trim(); renderTable(skus); });
  $('#sort').addEventListener('change',e=>{ state.sort=e.target.value; renderTable(skus); });
  $('#onlyDiv').addEventListener('change',e=>{ state.onlyDiv=e.target.checked; renderTable(skus); });
  document.querySelectorAll('tr.lote').forEach(tr=>tr.addEventListener('click',()=>{ state.scope=+tr.dataset.lote; state.open.clear(); render(); }));
}

/* ============ RENDER: acuracidade de SKUs (relatório) ============ */
const pctCls = x => x===null ? '' : x>=0.98 ? 'g' : x<0.8 ? 'r' : '';
const fP2 = x => x===null ? '–' : fPct(x,2);
const fP1 = x => x===null ? '–' : fPct(x,1);
function accCols(t, kind){   // kind: 'sku' (contagem de SKUs) ou 'end' (contagem de endereços)
  const nA = kind==='sku' ? t.sk.size : t.n, nD = kind==='sku' ? t.skD.size : t.nDiv;
  return `<td>${t.aud>0?fBRL0(t.aud):'–'}</td><td>${t.dv?fBRL0(t.dv):'–'}</td><td class="${t.sem<0?'r':''}">${t.aud>0?fBRL0(t.sem):'–'}</td><td>${fP1(t.accF)}</td>
    <td>${fInt(t.ger)}</td><td>${fInt(t.qd)}</td><td>${fP1(t.accQ)}</td>
    <td>${fInt(nA)}</td><td>${fInt(nD)}</td><td>${nA?fP1(1-nD/nA):'–'}</td>`;
}
const accHead = kind => `<th>Valor<br>auditado</th><th>Diverg.<br>R$</th><th>Valor sem<br>diverg.</th><th>Acur.<br>fin.</th><th>Qtd.<br>gerada</th><th>Qtd.<br>diverg.</th><th>Acur.<br>qtd.</th>`
  + (kind==='sku' ? `<th>SKUs<br>audit.</th><th>SKUs<br>diverg.</th><th>SKUs<br>OK</th>` : `<th>End.<br>audit.</th><th>End.<br>diverg.</th><th>End.<br>OK</th>`);
function sumGroup(list){   // agrega SKUs numa linha só
  const g = {n:0,nDiv:0,aud:0,dv:0,ger:0,qd:0};
  list.forEach(s=>{ for(const k in g) g[k]+=s[k]; });
  g.sem = g.aud-g.dv; g.accF = g.aud>0 ? accOf(g.aud,g.dv) : null; g.accQ = accOf(g.ger,g.qd);
  return g;
}
function renderAcc(){

  const oks = skus.filter(s=>s.nDiv===0);

  const skuBody = shown.map(skuRow).join('')
    + (rest.length ? aggRow(`Outros ${rest.length} SKUs com divergência`, rest) : '')

    + `<tr class="tot"><td>TOTAL</td>${accCols(T,'end')}</tr>`;

  const noPrice = T.noP.size;

  box.innerHTML = `
  ${state.sample ? '<div class="banner noexp">Dados de exemplo. Adicione os lotes reais na barra lateral.</div>' : ''}

    </div>

      <div class="kc"><div class="k">Acuracidade quantitativa</div><div class="v ${pctCls(T.accQ)}">${fP2(T.accQ)}</div></div>
      <div class="kc"><div class="k">SKUs 100% OK</div><div class="v ${pctCls(skuOk)}">${fP2(skuOk)}</div><div class="s">${T.sk.size-T.skD.size} de ${T.sk.size} SKUs · endereços ${fP1(1-T.nDiv/T.n)} OK</div></div>
      <div class="kc"><div class="k">Valor total auditado</div><div class="v">${fBRL0(T.aud)}</div></div>
      <div class="kc"><div class="k">Divergência absoluta</div><div class="v r">${fBRL0(T.dv)}</div></div>
      <div class="kc"><div class="k">Valor sem divergência</div><div class="v g">${fBRL0(T.sem)}</div></div>
    </div>

    <section class="ablock">
      <h2>Resumo por área</h2>
      <div class="tw"><table class="at">
        <thead><tr><th>Área</th>${accHead('sku')}</tr></thead>
        <tbody>
          <tr><td>Picking</td>${accCols(area.A,'sku')}</tr>
          <tr><td>Pulmão</td>${accCols(area.P,'sku')}</tr>
          <tr class="tot"><td>TOTAL</td>${accCols(T,'sku')}</tr>
        </tbody></table></div>
    </section>

        ${divs.length>CAP ? `<button type="button" class="btn2 noexp" id="accAll">${state.accAll?`Mostrar só os ${CAP} maiores`:`Mostrar todos os ${divs.length} divergentes`}</button>` : ''}</div>
      <div class="tw"><table class="at">

        <tbody>${skuBody}</tbody></table></div>
    </section>

    <h2 class="acomp-h">Composição da divergência</h2>
    <div class="acomp">
      <div class="cc gain"><h3>Ganho / Sobra</h3><dl>
        <dt>Quantidade</dt><dd>${fInt(T.sQ)}</dd><dt>Valor</dt><dd>${fBRL0(T.sV)}</dd><dt>SKUs</dt><dd>${T.skS.size}</dd></dl></div>
      <div class="cc loss"><h3>Perda / Falta</h3><dl>
        <dt>Quantidade</dt><dd>${fInt(T.fQ)}</dd><dt>Valor</dt><dd>${fBRL0(T.fV)}</dd><dt>SKUs</dt><dd>${T.skF.size}</dd></dl></div>
      <div class="cc net ${netCls}"><h3>Saldo líquido</h3><dl>

async function accCanvas(){
  const app = $('#app'), el = $('#accReport');
  app.classList.add('exporting');
  try{
    return await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true,windowWidth:1400,width:el.scrollWidth,height:el.scrollHeight});
  } finally { app.classList.remove('exporting'); }
}
async function exportAcc(mode){
  let canvas; try{ canvas = await accCanvas(); }catch(err){ alert('Falha ao gerar imagem: '+err.message); return; }
  const name = 'acuracidade_skus_'+(state.scope==='all'?(state.month||'geral'):safeId(state.lots[state.scope].id))+'_'+isoToday()+'.png';
  const download = () => { const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=name; a.click(); };
  if(mode==='copy' && navigator.clipboard && window.ClipboardItem){
    try{
      const blob = await new Promise(ok=>canvas.toBlob(ok,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('Imagem copiada. É só colar no WhatsApp.'); return;
    }catch(e){ toast('Não deu para copiar neste navegador. Baixei a imagem.'); }
  }
  download();
}

function renderEvo(){
  const box=$('#body'), lots=monthLots();
  if(!lots.length){ box.innerHTML='<div class="panel empty">Sem lotes no histórico ainda.</div>'; return; }
  const days = evoData(lots), R = recurrence(lots), cum = state.evoMode==='cum';
  const last = days[days.length-1];
  $('#sub').textContent = `${monthShort(state.month)} · ${lots.length} lote(s) · ${days.length} dia(s) · ${fDate(days[0].date)} a ${fDate(last.date)}`;

  const labels = days.map(d=>fDM(d.date));
  const skuSeries = [{vals:days.map(d=>cum?d.skusCum:d.skus), color:css('--navy2')||'#16265A'}];
  const finSeries = [{vals:days.map(d=>cum?d.cSobra:d.sobra), color:css('--ok')},{vals:days.map(d=>cum?d.cFalta:d.falta), color:css('--bad')}];
  const skuChart = svgChart(labels, [{vals:skuSeries[0].vals,color:'#3556B5'}], v=>fInt(v));
  const finChart = svgChart(labels, finSeries, fK);

  const d = (cur,prev,f)=> prev===undefined ? '' : (cur-prev>0 ? `<span class="delta up">+${f(cur-prev)}</span>` : cur-prev<0 ? `<span class="delta">${f(cur-prev)}</span>` : '<span class="delta">=</span>');
  const trs = days.map((x,i)=>{ const p=days[i-1]; return `<tr>
    <td>${fDate(x.date)}</td><td class="num">${x.lotes}</td>
    <td class="num">${fInt(x.skus)}</td>
    <td class="num">${fInt(x.skusCum)}${d(x.skusCum,p?.skusCum,fInt)}</td>
    <td class="num">${fInt(x.n)}<span class="delta">${x.nDiv} div.</span></td>
    <td class="num">${fPct(x.acc)}</td>
    <td class="num">${fBRL0(x.abs)}</td>
    <td class="num">${fBRL0(x.cAbs)}${d(x.cAbs,p?.cAbs,fBRL0)}</td>
    <td class="num ${signCls(x.cSaldo)}">${fBRL0(x.cSaldo)}</td></tr>`; }).join('');

  // matriz de recorrência
  const shown = R.rec.slice(0,25);
  const head = lots.map(l=>`<th title="${esc(l.label)}">${fDM(l.date)}<br><span style="color:var(--muted);font-weight:400">${esc(String(l.id).slice(0,6))}</span></th>`).join('');
  const body = shown.map(s=>`<tr><td><span class="skuname">${esc(s.prod)}</span><span class="skucod num">${s.cod}</span></td>
    ${s.per.map((c,i)=>{ const cls=!c?'none':c.nDiv===0?'ok':(c.abs>=CRIT?'crit':'div'); const tip=!c?'não auditado':`${c.nDiv} de ${c.n} endereço(s) divergente(s)${c.nDiv?', '+fBRL(c.val):''}`;
      return `<td><span class="mc ${cls}" title="${esc(lots[i].label+': '+tip)}"></span></td>`; }).join('')}
    <td class="sum num">${s.divLotes} de ${s.audited} lotes<span class="delta">${fBRL0(s.abs)} abs.</span></td></tr>`).join('');
  const addrRows = R.addrs.slice(0,30).map(e=>{
    const same = e.ev.every(x=>x.div===e.ev[0].div && x.val===e.ev[0].val);
    return `<tr><td class="num" style="text-align:left">${esc(e.end)}</td><td style="text-align:left">${esc(e.prod)}</td>
      <td style="text-align:left">${e.ev.map(x=>`${esc(lots[x.i].label)}: ${x.div>0?'+':''}${fNum(x.div)} (${fBRL0(x.val)})`).join('<br>')}</td>
      <td class="tag" style="text-align:left">${same?'igual em todos os lotes, sem ajuste':'mudou entre os lotes'}</td></tr>`; }).join('');

  box.innerHTML = `
  ${state.sample ? '<div class="banner noexp">Dados de exemplo (as datas do exemplo são ilustrativas). O histórico real começa quando você carrega as planilhas.</div>' : ''}
  <div class="kstrip">
    <div><div class="k">SKUs auditados (acumulado)</div><div class="v">${fInt(last.skusCum)}</div><small>${fInt(last.skus)} no último dia</small></div>
    <div><div class="k">Divergência absoluta acumulada</div><div class="v">${fBRL0(last.cAbs)}</div><small>saldo ${fBRL0(last.cSaldo)}</small></div>
    <div><div class="k">SKUs recorrentes</div><div class="v">${R.rec.length}</div><small>divergiram em 2+ lotes</small></div>
    <div><div class="k">Endereços recorrentes</div><div class="v">${R.addrs.length}</div><small>divergiram em 2+ lotes</small></div>
  </div>

  <section class="panel">
    <div class="head"><div><h2>Evolução dia a dia</h2><p class="hint">${cum?'Acumulado desde o primeiro lote':'Somente o que foi auditado em cada dia'}. O dia usa a última contagem de cada endereço.</p></div>
      <div class="seg noexp" role="group" aria-label="Modo"><button type="button" data-m="cum" aria-pressed="${cum}">Acumulado</button><button type="button" data-m="dia" aria-pressed="${!cum}">Por dia</button></div></div>
    <div class="charts">
      <div><h3>SKUs auditados${cum?' (acumulado)':''}</h3><div class="tw">${skuChart}</div></div>
      <div><h3>Divergência R$: sobra acima, falta abaixo${cum?' (acumulado)':''}</h3><div class="tw">${finChart}</div></div>
    </div>
    <div class="tw"><table class="evo"><thead><tr><th>Data</th><th>Lotes</th><th>SKUs no dia</th><th>SKUs acumulado</th><th>Endereços</th><th>Acur. qtd.</th><th>Diverg. R$ no dia</th><th>Diverg. R$ acumulada</th><th>Saldo acumulado</th></tr></thead><tbody>${trs}</tbody></table></div>
  </section>

  <section class="panel">
    <h2>Itens com recorrência</h2>
    <p class="hint">SKUs que divergiram em mais de um lote. Cada quadrado é um lote: vermelho crítico, laranja divergente, verde OK, tracejado não auditado.</p>
    ${shown.length ? `<div class="tw"><table class="matrix"><thead><tr><th>SKU</th>${head}<th style="text-align:right">Recorrência</th></tr></thead><tbody>${body}</tbody></table></div>
      ${R.rec.length>shown.length?`<p class="hint" style="margin-top:8px">Mostrando 25 de ${R.rec.length} SKUs.</p>`:''}`
      : '<div class="empty">Nenhum SKU divergiu em mais de um lote até agora.</div>'}
    ${R.addrs.length ? `<h2 style="margin-top:20px">Endereços que voltaram a divergir</h2>
      <div class="tw"><table style="min-width:640px"><thead><tr><th>Endereço</th><th>SKU</th><th>Ocorrências</th><th>Situação</th></tr></thead><tbody>${addrRows}</tbody></table></div>` : ''}
  </section>

  <div class="foot noexp">
    <span>Acumulado soma o que cada dia encontrou. Se o mesmo endereço continua divergente em dias seguidos, ele volta a somar, e aparece em “Endereços que voltaram a divergir”.</span>
  </div>`;

  box.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ state.evoMode=b.dataset.m; renderEvo(); }));
}

/* ============ CARREGAR LOTES (barra lateral) ============ */
async function saveDefs(defs){
  let ok=0;
  for(const d of defs){
    try{ await Store.save({id:d.id,label:d.label,date:d.date,rows:d.rows.map(compactRow)}); ok++; }
    catch(e){ toast('Falha ao salvar '+d.label+': '+e.message); }
  }
  await reloadFromStore(); render();
  if(ok) toast(`${ok} lote(s) salvo(s) no histórico.`);
}
const mkLabel = (id,date) => (/^\d+$/.test(id) ? 'Lote '+id : id) + ' · ' + fDM(date);
function yearFor(dd,mm){ const now=new Date(); let y=now.getFullYear(); if(new Date(y,mm-1,dd).getTime() > now.getTime()+3*864e5) y--; return y; }
function guessDate(name, lastMod){
  let m;
  if((m=/(?<!\d)(20\d{2})[-_.](\d{2})[-_.](\d{2})(?!\d)/.exec(name))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=/(?<!\d)(\d{2})[-_.](\d{2})[-_.](20\d{2})(?!\d)/.exec(name))) return `${m[3]}-${m[2]}-${m[1]}`;
  if((m=/(?:^|\D)(\d{1,2})[-_.](\d{1,2})(?!\d)/.exec(name)) && +m[1]<=31 && +m[2]<=12) return `${yearFor(+m[1],+m[2])}-${pad2(+m[2])}-${pad2(+m[1])}`;
  const d=new Date(lastMod||Date.now()); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function guessId(name){
  const base = name.replace(/\.[^.]+$/,'').replace(/(?<!\d)20\d{2}[-_.]\d{2}[-_.]\d{2}(?!\d)|(?<!\d)\d{2}[-_.]\d{2}[-_.]20\d{2}(?!\d)/g,'');
  const m=/(\d{3,})/.exec(base); return m ? m[1] : safeId(name.replace(/\.[^.]+$/,''));
}
async function readText(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
async function stageFiles(files){
  const staged=[];
  try{
    for(const f of files){
      if(/\.(xlsx|xls)$/i.test(f.name)){
        const wb = XLSX.read(await f.arrayBuffer(),{type:'array'});
        wb.SheetNames.forEach(n=>{
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
          const rows = aoa.filter(r=>isAddr(r[0])).map(normRow);
          if(rows.length) staged.push({name:f.name+' · '+n, id:idFromSheet(n), date:dateFromSheet(n)||guessDate(f.name,f.lastModified), rows});
        });
      } else {
        const rows = parseCSV(await readText(f));
        if(rows.length) staged.push({name:f.name, id:guessId(f.name), date:guessDate(f.name,f.lastModified), rows});
      }
    }
  }catch(err){ alert('Não consegui ler o arquivo: '+err.message); return; }
  if(!staged.length){ alert('Nenhuma linha de endereço encontrada. Confira se as colunas seguem o padrão: Endereço; Código; Produto; Embalagem; Qtde CONTAGEM 1; Qtde GERADA; Divergência; Valor Divergência.'); return; }
  state.staged = state.staged.concat(staged);
  renderStaged();
  if(innerWidth<=980) $('#app').classList.remove('side-closed');
}
function stagedWarn(i){
  const s=state.staged[i], el=document.getElementById('w'+i); if(!el||!s) return;
  const id=safeId(s.id), ex = state.sample ? null : state.lots.find(l=>l.id===id);
  const aba = /^\d{4}-\d{2}-\d{2}$/.test(s.date||'') ? 'Vai para a aba '+monthShort(monthKey(s.date))+'.' : 'Informe a data.';
  el.textContent = (ex ? `Lote já existe (${fDate(ex.date)}): será substituído. ` : '') + aba;
}
function renderStaged(){
  const box=$('#staged');
  if(!state.staged.length){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="stg"><h3>Confira antes de salvar</h3>
    ${state.staged.map((s,i)=>`<div class="sc">
      <div class="sn"><span>${esc(s.name)} <small>${s.rows.length} linhas</small></span><button type="button" class="x" data-rm="${i}" aria-label="Remover da lista">×</button></div>
      <div class="sf"><label>Nº do lote<input data-f="id" data-i="${i}" value="${esc(s.id)}"></label><label>Data do lote<input type="date" data-f="date" data-i="${i}" value="${esc(s.date||'')}"></label></div>
      <div class="warn" id="w${i}"></div></div>`).join('')}
    <div class="sa"><button type="button" class="btn2 primary" id="btnSaveStaged">Salvar ${state.staged.length} lote(s)</button><button type="button" class="btn2" id="btnCancelStaged">Cancelar</button></div></div>`;
  box.querySelectorAll('input[data-f]').forEach(inp=>inp.addEventListener('input',()=>{ const i=+inp.dataset.i; state.staged[i][inp.dataset.f]=inp.value; stagedWarn(i); }));
  box.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ state.staged.splice(+b.dataset.rm,1); renderStaged(); }));
  $('#btnCancelStaged').addEventListener('click',()=>{ state.staged=[]; renderStaged(); });
  $('#btnSaveStaged').addEventListener('click',saveStaged);
  state.staged.forEach((_,i)=>stagedWarn(i));
}
async function saveStaged(){
  const defs=[];
  for(const s of state.staged){
    const id=safeId(s.id||'');
    if(!id){ alert('Informe o número do lote de '+s.name); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date||'')){ alert('Informe a data do lote '+id); return; }
    defs.push({id,label:mkLabel(id,s.date),date:s.date,rows:s.rows});
  }
  if(new Set(defs.map(d=>d.id)).size!==defs.length){ alert('Há dois lotes com o mesmo número na lista. Ajuste antes de salvar.'); return; }
  const newest = defs.map(d=>d.date).sort().pop();
  state.staged=[]; renderStaged();
  state.view='sku'; state.month=monthKey(newest);
  await saveDefs(defs);
}
$('#file').addEventListener('change', async e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length) await stageFiles(fs); });
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop',async e=>{ const fs=[...(e.dataTransfer?.files||[])]; if(fs.length) await stageFiles(fs); });
drop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('#file').click(); } });

$('#btnReset').addEventListener('click', ()=>{ state.sample=true; setLots(EMBEDDED.map(l=>({id:l.id,label:l.label,date:l.date,rows:l.rows.map(normRow)}))); state.month=null; ensureMonth(); render(); toast('Mostrando dados de exemplo. Nada foi apagado do histórico.'); });
$('#btnSide').addEventListener('click',()=>$('#app').classList.toggle('side-closed'));
$('#btnPrint').addEventListener('click',()=>window.print());
async function exportJson(){
  const raw = await Store.load();
  const blob = new Blob([JSON.stringify(raw)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='inventario_sku_historico_'+isoToday()+'.json'; a.click();
}
$('#btnExpJson').addEventListener('click',exportJson);
$('#btnImpJson').addEventListener('click',()=>$('#fileJson').click());
$('#fileJson').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const list = JSON.parse(await f.text());
    if(!Array.isArray(list) || !list.every(l=>l.id && Array.isArray(l.rows))) throw new Error('arquivo fora do formato');
    await saveDefs(hydrate(list));
  }catch(err){ alert('Backup inválido: '+err.message); }
  e.target.value='';
});
$('#btnPng').addEventListener('click', async ()=>{
  if(state.view==='acc') return exportAcc('download');
  const el = $('#report');
  el.classList.add('exporting');
  try{
    const canvas = await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true});
    const a=document.createElement('a'); a.href=canvas.toDataURL('image/png');
    a.download=(state.view==='evo'?'inventario_sku_evolucao_':'inventario_por_sku_')+(state.month||'geral')+'_'+isoToday()+'.png'; a.click();
  }catch(err){ alert('Falha ao gerar imagem: '+err.message); }
  el.classList.remove('exporting');
});
try{ window.matchMedia?.('(prefers-color-scheme: dark)')?.addEventListener?.('change',()=>render()); }catch(e){}

(async function init(){
  await Store.init();
  await reloadFromStore();
  if(innerWidth<=980) $('#app').classList.add('side-closed');
  render();
})();
</script>
